
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>血之蒼雨｜個人創作網站</title>
  <meta name="description" content="血之蒼雨的小說、創作紀錄與作品收藏室。">
</head>
<body>
  <header>
    <h1>血之蒼雨</h1>
    <p>讓故事，找到自己的歸處。</p>
  </header>

  <main>
    <section class="welcome">
      <h2>歡迎來到我的創作收藏室</h2>
      <p>這裡收藏小說、角色、故事，以及一路走來留下的創作痕跡。</p>
    </section>

    <section class="works">
      <h2>代表作品</h2>

      <article class="work-card">
        <div class="cover-placeholder">
          <span>作品封面</span>
        </div>
        <div class="work-info">
          <h3>《異契雇傭》</h3>
          <p>當命運將不同的靈魂交會，契約之外的牽絆也悄然成形。</p>
          <a href="https://www.kadokado.com.tw/book/60218"
             target="_blank" rel="noopener noreferrer">
            前往作品頁 →
          </a>
        </div>
      </article>

      <article class="work-card">
        <div class="cover-placeholder">
          <span>作品封面</span>
        </div>
        <div class="work-info">
          <h3>《筆下有語》</h3>
          <p>文字不只是記錄，也藏著尚未說出口的心聲。</p>
          <a href="https://www.popo.tw/books/867186"
             target="_blank" rel="noopener noreferrer">
            前往作品頁 →
          </a>
        </div>
      </article>

      <article class="work-card">
        <div class="cover-placeholder">
          <span>作品封面</span>
        </div>
        <div class="work-info">
          <h3>《失控的語言：末日降臨》</h3>
          <p>當語言失去控制，世界也一步步走向崩壞。</p>
          <a href="https://www.popo.tw/books/865133"
             target="_blank" rel="noopener noreferrer">
            前往作品頁 →
          </a>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>© 血之蒼雨｜個人創作網站</p>
  </footer>

  <script>
    const cards = document.querySelectorAll(".work-card");

    if (
      "IntersectionObserver" in window &&
      !window.matchMedia("(prefers-reduced-motion: reduce)").matches
    ) {
      document.documentElement.classList.add("js-enabled");

      cards.forEach((card, index) => {
        card.classList.add(
          index % 2 === 0 ? "from-left" : "from-right"
        );
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("show");
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.15
      });

      cards.forEach((card) => observer.observe(card));
    }
  </script>
</body>
</html>
