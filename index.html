
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>血之蒼雨｜個人創作網站</title>
  <meta name="description" content="血之蒼雨的小說、創作紀錄與作品收藏室。">
</head>
<body>
  <header>
    <h1>血之蒼雨</h1>
    <p>。</p>
  </header>

  <main>
    <section>
      <h2>歡迎來到我的創作收藏室</h2>
      <p>這裡收藏小說、角色、故事，以及一路走來留下的創作痕跡。</p>
    </section>

    <section>
      <h2>代表作品</h2>
      <ul>
        <li>
          <a href="https://www.kadokado.com.tw/book/60218">
            《異契雇傭》
          </a>
        </li>
        <li>
          <a href="https://www.popo.tw/books/867186">
            《筆下有語》
          </a>
        </li>
        <li>
          <a href="https://www.popo.tw/books/865133">
            《失控的語言：末日降臨》
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 血之蒼雨｜個人創作網站</p>
  </footer>


<script>
  document.documentElement.classList.add("js-enabled");
  const sections = document.querySelectorAll("main section");

  sections.forEach((section, index) => {
    section.classList.add(
      index % 2 === 0 ? "from-left" : "from-right"
    );
  });

  if ("IntersectionObserver" in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.15
    });

    sections.forEach((section) => observer.observe(section));
  } else {
    sections.forEach((section) => section.classList.add("show"));
  }
</script>
</body>
</html>

  
</body>
</html>
